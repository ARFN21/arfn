<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Prediksi Kesiapan Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard-shell">
    <section class="hero-card" aria-labelledby="dashboard-title">
      <p class="eyebrow">World Bank Internet Users Indicator</p>
      <h1 id="dashboard-title">Dashboard Prediksi Kesiapan Digital</h1>
      <p class="subtitle">
        Laporan ini menampilkan hasil pipeline Python untuk data persentase pengguna internet,
        proses cleansing, dan evaluasi model Decision Tree.
      </p>
      <div class="report-actions">
        <p class="report-status" data-report-status>Jalankan proses_worldbank_ml.py untuk membuat hasil_ml.html.</p>
        <button class="refresh-button" type="button" data-refresh-report>Refresh Laporan</button>
      </div>
      <div class="iframe-wrap">
        <iframe src="hasil_ml.html" title="Laporan hasil machine learning" data-report-frame></iframe>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
